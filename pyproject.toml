[project]
name = "brock-treadmill-daq"
version = "0.2.0"
description = "USB-1608GX-2AO driver and loopback tests"
requires-python = ">=3.10"
dependencies = [
    "pyusb>=1.2",
    "libusb-package>=1.0",
    "matplotlib",
    "numpy",
]

[project.optional-dependencies]
# Only needed by compare_uldaq.py, which checks our driver against MCC's library.
compare = ["uldaq"]
# Only needed by `loadcell_cal.py --check-sheets`, which re-reads the calibration PDFs.
sheets = ["pypdf"]

[project.scripts]
loopback = "loopback_test:main"
sinusoid = "sinusoid_loopback:main"
sinusoid-scan = "sinusoid_scan:main"
compare-uldaq = "compare_uldaq:main"
forceplate-gui = "forceplate_gui:main"
forceplate-fit = "forceplate:main"
loadcell-cal = "loadcell_cal:main"
capture-check = "capture_check:main"
strike-tests = "strike_tests:main"
deck-modes = "deck_modes:main"
modes-gui = "modes_gui:main"

[tool.uv]
# Always use uv's own Python builds, which include tkinter (the GUI toolkit).
# A system Python (Homebrew, Linux distro) often ships without it.
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcc1608g"]
include = ["loopback_test.py", "sinusoid_loopback.py", "sinusoid_scan.py", "compare_uldaq.py",
           "forceplate.py", "forceplate_gui.py", "tk_env.py", "loadcell_cal.py",
           "loopback_live.py", "capture_check.py", "strike_tests.py",
           "deck_modes.py", "modes_gui.py",
           "forceplate_layout.json"]
